<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>logfmt &mdash; Rust log output, rendered</title>
  <meta name="description" content="Side-by-side reference for Rust log macros across env_logger, tracing-subscriber (Full / Compact / Pretty / Json), and the tracing-log bridge, for every common format spec.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@100..700&family=Recursive:MONO,wght@1,300..700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/commit-mono@latest/400.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="syntax.css">
  <script>
    (function () {
      var pref = localStorage.getItem('theme');
      var dark = pref === 'dark' ||
                 (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <header>
    <h1>logfmt <span class="tagline">&mdash; log string formatting cheat sheet</span></h1>
    <button class="theme-toggle" type="button" aria-label="Toggle theme">Dark</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Logger" data-axis="top">
    <button class="tab" type="button" data-top="tracing-subscriber" aria-selected="true"><code>tracing-subscriber</code></button>
    <button class="tab" type="button" data-top="bridge" aria-selected="false"><code>tracing-log</code> bridge</button>
    <button class="tab" type="button" data-top="env_logger" aria-selected="false"><code>env_logger</code></button>
  </nav>

  <nav class="tabs subtabs" role="tablist" aria-label="tracing-subscriber variant" data-axis="sub">
    <button class="tab" type="button" data-sub="full" aria-selected="true">Full <span class="hint">(default)</span></button>
    <button class="tab" type="button" data-sub="compact" aria-selected="false">Compact</button>
    <button class="tab" type="button" data-sub="pretty" aria-selected="false">Pretty</button>
    <button class="tab" type="button" data-sub="json" aria-selected="false">Json</button>
  </nav>

  <div class="panels" data-active-top="tracing-subscriber" data-active-sub="full">
{{cells}}
  </div>

{{owner_footer}}

  <script>
    const panels = document.querySelector('.panels');
    const subtabs = document.querySelector('nav.tabs.subtabs');

    function activeLogger() {
      const top = panels.dataset.activeTop;
      const sub = panels.dataset.activeSub;
      if (top === 'env_logger') return 'env_logger_default';
      if (top === 'bridge') return 'tracing_log_bridge';
      return 'tracing_' + sub;
    }

    function update() {
      const logger = activeLogger();
      panels.querySelectorAll('article.cell').forEach(c => {
        c.hidden = c.dataset.logger !== logger;
      });
      subtabs.classList.toggle('inactive', panels.dataset.activeTop !== 'tracing-subscriber');
    }

    document.querySelectorAll('nav.tabs').forEach(nav => {
      const axis = nav.dataset.axis;
      nav.addEventListener('click', e => {
        const btn = e.target.closest('button[data-' + axis + ']');
        if (!btn) return;
        const value = btn.dataset[axis];
        nav.querySelectorAll('button').forEach(b =>
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false'));
        if (axis === 'top') panels.dataset.activeTop = value;
        else panels.dataset.activeSub = value;
        update();
      });
    });

    update();

    const themeBtn = document.querySelector('.theme-toggle');
    const root = document.documentElement;
    function effectiveTheme() {
      return root.classList.contains('dark') ? 'dark' : 'light';
    }
    function refreshThemeBtn() {
      themeBtn.textContent = effectiveTheme() === 'dark' ? 'Light' : 'Dark';
    }
    themeBtn.addEventListener('click', () => {
      const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      root.classList.toggle('dark', next === 'dark');
      localStorage.setItem('theme', next);
      refreshThemeBtn();
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('theme')) {
        root.classList.toggle('dark', e.matches);
        refreshThemeBtn();
      }
    });
    refreshThemeBtn();
  </script>
</body>
</html>
